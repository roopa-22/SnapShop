<div class="productCard w-[13rem] m-3 transition-all cursor-pointer">

    <div class="h-[18rem]">
        <img class="h-full w-full" [src]="product.imageUrl" alt="Product" >
    </div>

    <div class="textPart p-3">
        <div>
            <p class="opacity-80">{{product.brand}}</p>
            <p>{{product.title}}</p>
       </div>
        <div class="flex flex-wrap space-x-2 items-center">
            <p class="font-bold">{{product.selling_price}}</p>
            <p class="text-gray-600 line-through">{{product.price}}</p>
            <p class="text-green-600 font-semibold">{{product.disscount}}</p>
        </div>
    </div>
</div>
