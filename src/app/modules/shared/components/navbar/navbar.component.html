<div class="fixed top-0 z-50 right-0 left-0 bg-[#f77ea9] text-gray-800 px-5 lg:px-10">

    <div class="h-14 flex items-center justify-between">

      <div class="flex items-center">
  
        <div class="mr-5 ml-10">
            <img class="w-9" [src]="appLogo" alt="SnapShop">
        </div>

        <div class="">
           <div class="flex items-center space-x-4">
              <a (click)="navigateHome('/')" class="cursor-pointer text-gray-800 font-semibold text-lg">
                SnapShop
              </a>

              <button class="open-button" (click)="openNavbarContent('women')" mat-button >
                Women
              </button>

              <button class="open-button" (click)="openNavbarContent('men')" mat-button>
                Men
              </button>

           </div>
        </div>

      </div>
      <div class="flex items-center">
            
           <button (click)="navigateTo('cart')"  mat-icon-button>
               <mat-icon>shopping_cart</mat-icon>
           </button>

           <button mat-raised-button (click)="handleOpenLoginModel()"*ngIf="!userProfile" mat-button type="">
              Login
           </button>

           <div *ngIf="userProfile" class="relative ml-3 flex items-center">
              <div class="flex items-center space-x-5">

                <span class="font-medium text-lg">{{userProfile.firstName}}</span>
                <button mat-button [matMenuTriggerFor] = "profileMenu">
                    <img class="h-8 w-8" src="https://cdn.pixabay.com/photo/2023/05/02/10/32/avatar-7964941_1280.png" alt="">
                </button> 
                <mat-menu #profileMenu="matMenu">
                   <button mat-menu-item>Profile</button>
                   <button (click)="navigateTo('account/orders')" mat-menu-item>Orders</button>
                   <button (click)="handleLogOut()" mat-menu-item>Logout</button>
                </mat-menu>

              </div>
           </div>
        </div>  
    </div>
    <div *ngIf="isNavbarContentOpen" class=" absolute right-0 left-0 model-container">
      <app-navbar-content [selectedSection] = currentSection />
    </div>
</div>
