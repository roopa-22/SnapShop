<div class="w-full">
  <div class="bg-gray-950 text-white w-full h-1/2 shadow-lg p-6">
    <div class="flex justify-around">
      <div
        class="flex flex-col"
        *ngFor="let item of category[selectedSection].sections">
        <h2 class="text center">{{ item.name }}</h2>
        <button *ngFor = "let section of item.items">
          {{section.name}}
        </button>
      </div>
      <div class="hidden lg:block">
        <div class="mb-5">
          <img class="w-[19rem] h-[20rem] object-cover object-top 
          rounded-md" src="https://www.biba.in/on/demandware.static/-/Library-Sites-BibaSharedLibrary/default/dwaa38297f/lehengas-and-skirt-sets/women%20lehenga.jpg" alt="">
        </div>
        <p class="text-gray-600">New Arrival</p>
        </div>
        <div class="hidden lg:block">
        <div class="mb-5">
          <img class="w-[19rem] h-[20rem] object-cover object-top 
          rounded-md" src="https://suratikart.com/cdn/shop/files/NKB-50YELLOW_2.jpg?v=1739168183" alt="">
        </div>
        <p class="text-gray-600">New Arrival</p>
        </div>
    </div>
  </div>
</div>
