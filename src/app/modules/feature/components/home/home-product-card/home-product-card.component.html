<div class="box hover:scale-105 transition-all duration-500 cursor-pointer
 flex flex-col items-center rounded-lg overflow-hidden w-[12rem] mx-3">

   <div class="h-[15rem] w-[10rem]">
     
       <img style="height:95%" [src] = "product.imageUrl" alt="">

   </div>
    
   <div class="p-4">
      
       <h6 class="font-medium text-gray-900 text-sm">{{product.brand}}</h6>
       <p class="mt-2 text-sm text-gray-500">
        {{product.title}}
       </p>
   </div>

</div>
